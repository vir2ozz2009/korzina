name: Demo smoke
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/shared/contracts/catalog*.ts'
      - 'public/assets/catalog/**'
      - 'public/_headers'
      - 'scripts/catalog-smoke.ts'
      - '.github/workflows/demo-smoke.yml'
permissions:
  contents: read
concurrency:
  group: demo-smoke
  cancel-in-progress: true
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      # Native Node TypeScript, no dependencies or repeat of the full check.
      - run: node scripts/catalog-smoke.ts https://demo.korzina.app --wait-for-build
