name: E2E
run-name: ${{ inputs.target == 'regressions' && 'Регрессии · ручной прогон на demo' || '' }}
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Проверяемая среда
        type: choice
        options: [local, demo, regressions]
        default: local
permissions:
  contents: read
  id-token: write
  issues: write
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    permissions:
      contents: read
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && inputs.target != 'regressions'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ inputs.target == 'demo' && 'https://demo.korzina.app' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-result
          path: test-results/
          retention-days: 7
  regressions:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'regressions'
    uses: ./.github/workflows/regressions.yml
