name: E2E
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Проверяемая среда
        type: choice
        options: [local, demo]
        default: local
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'e2e') &&
      (github.event.action != 'labeled' || github.event.label.name == 'e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ inputs.target == 'demo' && 'https://demo.korzina.app' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-result
          path: test-results/
          retention-days: 7
