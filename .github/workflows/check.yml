name: Check
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    if: github.event.pull_request.draft == false && startsWith(github.head_ref, 'task/')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check documentation and skill metadata
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 scripts/test_check_docs.py
          python3 scripts/check-docs.py --base "$PR_BASE_SHA"
      - name: Classify pull request changes
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          full_check=$(python3 scripts/check-docs.py --base "$PR_BASE_SHA" --classify)
          printf 'full_check=%s\n' "$full_check" >> "$GITHUB_OUTPUT"
          if [[ "$full_check" == false ]]; then
            echo 'Documentation-only pull request. Links and metadata checked without runtime tests.'
          fi
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.full_check == 'true'
        with:
          node-version-file: .node-version
          cache: npm
      - run: node scripts/check-pr-size.ts
        if: steps.scope.outputs.full_check == 'true'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - run: npm ci
        if: steps.scope.outputs.full_check == 'true'
      - run: npm run check
        if: steps.scope.outputs.full_check == 'true'
      - run: npx playwright install chromium
        if: steps.scope.outputs.full_check == 'true'
      - run: npm run platform:setup -- --local --seed
        if: steps.scope.outputs.full_check == 'true'
      - run: node scripts/built-demo-smoke.ts
        if: steps.scope.outputs.full_check == 'true'
      - run: node scripts/wait-for-preview.ts
        if: steps.scope.outputs.full_check == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - run: npm run test:e2e -- --grep-invert @home-cart
        if: steps.scope.outputs.full_check == 'true'
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.full_check == 'true'
        with:
          name: pr-browser-result
          path: test-results/
          retention-days: 7
