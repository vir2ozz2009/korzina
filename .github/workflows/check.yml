name: Check
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  suite:
    if: github.event.pull_request.draft == false && startsWith(github.head_ref, 'task/')
    strategy:
      fail-fast: false
      matrix:
        scenario: [storefront, purchase]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: node scripts/check-pr-size.ts
        if: matrix.scenario == 'storefront'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - run: npm ci
      - run: npm run check
        if: matrix.scenario == 'storefront'
      # The Ubuntu runner already has Chromium's shared libraries.
      - run: npx playwright install chromium
      - run: npm run platform:setup -- --local --seed
        if: matrix.scenario == 'storefront'
      - run: node scripts/built-demo-smoke.ts
        if: matrix.scenario == 'storefront'
      - run: node scripts/wait-for-preview.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # B10 and the storefront use separate runner IPs for the demo API rate limit.
      - run: npm run test:e2e -- --grep-invert '@home-cart|B10:'
        if: matrix.scenario == 'storefront'
      - run: npm run test:e2e -- --grep 'B10:'
        if: matrix.scenario == 'purchase'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-browser-result-${{ matrix.scenario }}
          path: test-results/
          retention-days: 7

  check:
    if: always() && github.event.pull_request.draft == false && startsWith(github.head_ref, 'task/')
    needs: suite
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: test "$SUITE_RESULT" = success
        env:
          SUITE_RESULT: ${{ needs.suite.result }}
